<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Evaluator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --muted: #666;
      --approved: #1a7f37;
      --approved-bg: #e6f4ea;
      --flag: #9a6700;
      --flag-bg: #fff8e1;
      --reject: #b91c1c;
      --reject-bg: #fef2f2;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --score-track: #e8e8e8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    /* Input form */
    .input-row {
      display: flex;
      gap: 0.75rem;
    }

    #url-input {
      flex: 1;
      padding: 0.65rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    #url-input:focus { border-color: var(--accent); }

    #submit-btn {
      padding: 0.65rem 1.4rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    #submit-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #submit-btn:disabled { opacity: 0.6; cursor: default; }

    /* Spinner */
    .spinner {
      display: none;
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .spinner.active { display: block; }

    .spinner-ring {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 0.75rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-box {
      display: none;
      background: var(--reject-bg);
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 0.9rem 1rem;
      color: var(--reject);
      font-size: 0.9rem;
    }

    .error-box.active { display: block; }

    /* Results */
    #results { display: none; }
    #results.active { display: block; }

    /* Verdict banner */
    .verdict-banner {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      border-radius: 12px;
      margin-bottom: 1.25rem;
    }

    .verdict-banner.approved { background: var(--approved-bg); border: 1px solid #bbf7d0; }
    .verdict-banner.needs-review { background: var(--flag-bg); border: 1px solid #fde68a; }
    .verdict-banner.rejected { background: var(--reject-bg); border: 1px solid #fca5a5; }

    .verdict-icon { font-size: 2rem; flex-shrink: 0; }

    .verdict-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.2rem;
    }

    .verdict-banner.approved .verdict-label { color: var(--approved); }
    .verdict-banner.needs-review .verdict-label { color: var(--flag); }
    .verdict-banner.rejected .verdict-label { color: var(--reject); }

    .verdict-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .verdict-rec {
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .story-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    /* Criterion cards */
    .criteria-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    @media (max-width: 520px) {
      .criteria-grid { grid-template-columns: 1fr; }
      .input-row { flex-direction: column; }
    }

    .criterion-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .criterion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .criterion-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .criterion-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-pass { background: var(--approved-bg); color: var(--approved); }
    .badge-flag { background: var(--flag-bg); color: var(--flag); }
    .badge-reject { background: var(--reject-bg); color: var(--reject); }

    .score-display {
      display: flex;
      align-items: baseline;
      gap: 0.25rem;
      margin-bottom: 0.5rem;
    }

    .score-num {
      font-size: 2.25rem;
      font-weight: 700;
      line-height: 1;
    }

    .score-denom { font-size: 0.9rem; color: var(--muted); }

    .score-bar {
      height: 6px;
      background: var(--score-track);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .score-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.6s ease;
    }

    .fill-pass { background: var(--approved); }
    .fill-flag { background: #eab308; }
    .fill-reject { background: var(--reject); }

    .criterion-summary {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 0.6rem;
    }

    .issues-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .issues-list li {
      font-size: 0.8rem;
      display: flex;
      gap: 0.4rem;
      line-height: 1.4;
    }

    .issues-list li::before {
      content: "•";
      color: var(--reject);
      flex-shrink: 0;
    }

    .no-issues {
      font-size: 0.8rem;
      color: var(--approved);
    }

    /* Story info card */
    .story-card h3 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .story-card .story-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .story-card .story-url {
      font-size: 0.8rem;
      color: var(--accent);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Story Evaluator</h1>
      <p>Paste a story URL to check it against our community guidelines.</p>
    </header>

    <div class="card">
      <div class="input-row">
        <input
          id="url-input"
          type="url"
          placeholder="https://yoursite.com/stories/example-story"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="submit-btn" onclick="runEvaluation()">Evaluate</button>
      </div>
    </div>

    <div class="error-box" id="error-box"></div>

    <div class="spinner" id="spinner">
      <div class="spinner-ring"></div>
      Fetching and evaluating story&hellip;
    </div>

    <div id="results">
      <!-- Verdict banner -->
      <div class="verdict-banner" id="verdict-banner">
        <div class="verdict-icon" id="verdict-icon"></div>
        <div>
          <div class="verdict-label" id="verdict-label"></div>
          <div class="verdict-title" id="verdict-title"></div>
          <div class="verdict-rec" id="verdict-rec"></div>
        </div>
      </div>

      <!-- Criteria -->
      <div class="criteria-grid">
        <div class="criterion-card" id="safety-card">
          <div class="criterion-header">
            <span class="criterion-name">Safety &amp; Moderation</span>
            <span class="criterion-badge" id="safety-badge"></span>
          </div>
          <div class="score-display">
            <span class="score-num" id="safety-score"></span>
            <span class="score-denom">/100</span>
          </div>
          <div class="score-bar">
            <div class="score-fill" id="safety-bar"></div>
          </div>
          <div class="criterion-summary" id="safety-summary"></div>
          <ul class="issues-list" id="safety-issues"></ul>
        </div>

        <div class="criterion-card" id="tone-card">
          <div class="criterion-header">
            <span class="criterion-name">Tone &amp; Voice</span>
            <span class="criterion-badge" id="tone-badge"></span>
          </div>
          <div class="score-display">
            <span class="score-num" id="tone-score"></span>
            <span class="score-denom">/100</span>
          </div>
          <div class="score-bar">
            <div class="score-fill" id="tone-bar"></div>
          </div>
          <div class="criterion-summary" id="tone-summary"></div>
          <ul class="issues-list" id="tone-issues"></ul>
        </div>
      </div>

      <!-- Story info -->
      <div class="card story-card" id="story-info">
        <h3>Evaluated Story</h3>
        <div class="story-title" id="story-title-display"></div>
        <a class="story-url" id="story-url-display" target="_blank" rel="noopener"></a>
        <div class="story-meta" id="story-meta"></div>
      </div>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('url-input');

    urlInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') runEvaluation();
    });

    function verdictClass(verdict) {
      if (verdict === 'Approved') return 'approved';
      if (verdict === 'Needs Review') return 'needs-review';
      return 'rejected';
    }

    function verdictIcon(verdict) {
      if (verdict === 'Approved') return '✅';
      if (verdict === 'Needs Review') return '⚠️';
      return '🚫';
    }

    function badgeClass(verdict) {
      if (verdict === 'Pass') return 'badge-pass';
      if (verdict === 'Flag') return 'badge-flag';
      return 'badge-reject';
    }

    function fillClass(verdict) {
      if (verdict === 'Pass') return 'fill-pass';
      if (verdict === 'Flag') return 'fill-flag';
      return 'fill-reject';
    }

    function renderCriterion(prefix, data) {
      document.getElementById(`${prefix}-score`).textContent = data.score;
      document.getElementById(`${prefix}-summary`).textContent = data.summary;

      const badge = document.getElementById(`${prefix}-badge`);
      badge.textContent = data.verdict;
      badge.className = `criterion-badge ${badgeClass(data.verdict)}`;

      const bar = document.getElementById(`${prefix}-bar`);
      bar.style.width = `${data.score}%`;
      bar.className = `score-fill ${fillClass(data.verdict)}`;

      const issuesList = document.getElementById(`${prefix}-issues`);
      issuesList.innerHTML = '';
      if (data.issues && data.issues.length) {
        data.issues.forEach(issue => {
          const li = document.createElement('li');
          li.textContent = issue;
          issuesList.appendChild(li);
        });
      } else {
        const p = document.createElement('p');
        p.className = 'no-issues';
        p.textContent = 'No issues found.';
        issuesList.parentNode.insertBefore(p, issuesList);
      }
    }

    async function runEvaluation() {
      const url = urlInput.value.trim();
      if (!url) { urlInput.focus(); return; }

      // Reset state
      document.getElementById('error-box').classList.remove('active');
      document.getElementById('results').classList.remove('active');
      document.getElementById('spinner').classList.add('active');
      document.getElementById('submit-btn').disabled = true;

      try {
        const res = await fetch('/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        document.getElementById('spinner').classList.remove('active');
        document.getElementById('submit-btn').disabled = false;

        if (!res.ok || data.error) {
          const eb = document.getElementById('error-box');
          eb.textContent = data.error || 'An unexpected error occurred.';
          eb.classList.add('active');
          return;
        }

        // Verdict banner
        const vc = verdictClass(data.overall.verdict);
        const banner = document.getElementById('verdict-banner');
        banner.className = `verdict-banner ${vc}`;
        document.getElementById('verdict-icon').textContent = verdictIcon(data.overall.verdict);
        document.getElementById('verdict-label').textContent = 'Overall verdict';
        document.getElementById('verdict-title').textContent = data.overall.verdict;
        document.getElementById('verdict-rec').textContent = data.overall.recommendation;

        // Criteria
        renderCriterion('safety', data.safety);
        renderCriterion('tone', data.tone);

        // Story info
        const displayTitle = data.extracted_title || data.safety?.extracted_title || 'Untitled Story';
        document.getElementById('story-title-display').textContent = displayTitle;
        const urlEl = document.getElementById('story-url-display');
        urlEl.textContent = data.url;
        urlEl.href = data.url;
        document.getElementById('story-meta').textContent =
          `${data.char_count.toLocaleString()} characters evaluated`;

        document.getElementById('results').classList.add('active');
      } catch (err) {
        document.getElementById('spinner').classList.remove('active');
        document.getElementById('submit-btn').disabled = false;
        const eb = document.getElementById('error-box');
        eb.textContent = 'Network error — please check your connection and try again.';
        eb.classList.add('active');
      }
    }
  </script>
</body>
</html>
